<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D518C">
<meta name="description" content="Organiza y gestiona fácilmente tus listas de inventario.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="gemini.css">
<title>Almacén Fácil</title>

</head>
<body>

<div id="welcomeScreen" class="welcome-screen">

  <div class="welcome-content" >

    <img src="splash.png" id="enterBtn"  alt="Gallery Entrance">

  </div>
</div>

<header>
  <button id="back" class="hbtn" data-a="back" hidden aria-label="Volver" data-i18n-aria-label="back">◀</button>
  <h1 id="title" data-i18n="appTitle">Almacén Fácil 📦</h1>
  <span id="headerSpacer" class="header-spacer" hidden aria-hidden="true"></span>
</header>

<main id="app"></main>

<div id="modal" hidden></div>

<div id="listen" hidden>
  <div class="mic-stage">
    <span class="mic-ring" aria-hidden="true"></span>
    <span class="mic-ring" aria-hidden="true"></span>
    <div class="bigmic">🎤</div>
  </div>
  <p data-i18n-html="listening">Escuchando…<br>Hable ahora</p>
  <button class="big gray" style="max-width:360px" id="listen-cancel" data-i18n="cancel">Cancelar</button>
</div>

<div id="toast" hidden></div>

<footer>v. 1.4 - Guillermo R Monroy 2026</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
<script  src="stock.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(error => console.error('Service worker registration failed:', error));
    });
  }
</script>
</body>
</html>
